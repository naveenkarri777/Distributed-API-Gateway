# docker/prometheus/prometheus.yml
# Prometheus Scrape Configuration for Distributed API Gateways

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'api-gateways'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['gateway-1:3001', 'gateway-2:3002']
        labels:
          environment: 'production'
          service: 'api-gateway'
